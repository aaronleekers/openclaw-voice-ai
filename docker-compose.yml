version: '3.8'

services:
  voice-ai:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./voices:/app/voices
      - ./samples:/app/samples
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    runtime: nvidia
